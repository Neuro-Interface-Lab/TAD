name: tad-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - networkx>=3.2
  - scikit-learn>=1.4
  - matplotlib
  - spikeinterface
  - probeinterface
  - h5py
  - black
  - flake8
  - mypy
  - pre-commit
  - pygments
  - pytest>=7.0
  - pytest-cov
  - sphinx
  - sphinx-codeautolink
  - sphinx-copybutton
  - sphinx-gallery
  - sphinx-mdinclude
  - sphinx-rtd-theme
  - furo
  - pip
  - pip:
    - build
    - myst-parser
    - -e .
